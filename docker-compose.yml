services:
  postgres:
    image: pgvector/pgvector:pg17-trixie
    container_name: mercato-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open-mercato}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

  redis:
    image: redis:7-alpine
    container_name: mercato-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

  inngest-init:
    image: pgvector/pgvector:pg17-trixie
    container_name: mercato-inngest-init
    restart: "no"
    environment:
      PGPASSWORD: '${POSTGRES_PASSWORD:-postgres}'
    command: >
      sh -c "psql -h mercato-postgres -U ${POSTGRES_USER:-postgres} -tc
      \"SELECT 1 FROM pg_database WHERE datname = 'inngest'\" | grep -q 1 ||
      psql -h mercato-postgres -U ${POSTGRES_USER:-postgres} -c 'CREATE DATABASE inngest'"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mercato-network

  inngest:
    image: inngest/inngest:latest
    container_name: mercato-inngest
    restart: unless-stopped
    command: ["inngest", "start", "--host", "0.0.0.0", "--poll-interval", "5"]
    ports:
      - "${INNGEST_PORT:-8288}:8288"
    environment:
      INNGEST_EVENT_KEY: '${INNGEST_EVENT_KEY:-deadbeef00000000}'
      INNGEST_SIGNING_KEY: '${INNGEST_SIGNING_KEY:-e76da2be0b99bf81154903496abd262509c982cefa3763f934aab974f9938827}'
      INNGEST_POSTGRES_URI: 'postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@mercato-postgres:5432/inngest'
      INNGEST_REDIS_URI: 'redis://mercato-redis:6379'
    depends_on:
      inngest-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - mercato-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8288/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  verdaccio:
    image: verdaccio/verdaccio:6
    container_name: mercato-verdaccio
    restart: unless-stopped
    environment:
      VERDACCIO_PORT: 4873
      VERDACCIO_PUBLIC_URL: http://localhost:4873
    ports:
      - "${VERDACCIO_PORT:-4873}:4873"
    volumes:
      - verdaccio_storage:/verdaccio/storage
      - verdaccio_plugins:/verdaccio/plugins
      - ./config/verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4873/-/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

volumes:
  postgres_data:
    name: mercato-postgres-data
  redis_data:
    name: mercato-redis-data
  verdaccio_storage:
    name: mercato-verdaccio-storage
  verdaccio_plugins:
    name: mercato-verdaccio-plugins

networks:
  mercato-network:
    name: mercato-network
    driver: bridge