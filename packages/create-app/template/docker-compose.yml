services:
  postgres:
    image: pgvector/pgvector:pg17-trixie
    container_name: mercato-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open-mercato}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

  redis:
    image: redis:7-alpine
    container_name: mercato-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

  inngest-init:
    image: pgvector/pgvector:pg17-trixie
    container_name: mercato-inngest-init
    restart: "no"
    environment:
      PGPASSWORD: '${POSTGRES_PASSWORD:-postgres}'
    command: >
      sh -c "psql -h mercato-postgres -U ${POSTGRES_USER:-postgres} -tc
      \"SELECT 1 FROM pg_database WHERE datname = 'inngest'\" | grep -q 1 ||
      psql -h mercato-postgres -U ${POSTGRES_USER:-postgres} -c 'CREATE DATABASE inngest'"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mercato-network

  inngest:
    image: inngest/inngest:latest
    container_name: mercato-inngest
    restart: unless-stopped
    command: ["inngest", "start", "--host", "0.0.0.0", "--poll-interval", "5"]
    ports:
      - "${INNGEST_PORT:-8288}:8288"
    environment:
      INNGEST_EVENT_KEY: '${INNGEST_EVENT_KEY:-deadbeef00000000}'
      INNGEST_SIGNING_KEY: '${INNGEST_SIGNING_KEY:-e76da2be0b99bf81154903496abd262509c982cefa3763f934aab974f9938827}'
      INNGEST_POSTGRES_URI: 'postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@mercato-postgres:5432/inngest'
      INNGEST_REDIS_URI: 'redis://mercato-redis:6379'
    depends_on:
      inngest-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - mercato-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8288/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: mercato-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

volumes:
  postgres_data:
    name: mercato-postgres-data
  redis_data:
    name: mercato-redis-data
  meilisearch_data:
    name: mercato-meilisearch-data

networks:
  mercato-network:
    name: mercato-network
    driver: bridge
