services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      - node_modules:/workspace/node_modules
      - app_next:/workspace/apps/mercato/.next
      - attachments_storage:/workspace/apps/mercato/storage
      # Package dist/ volumes are auto-generated in docker-compose.volumes.yml
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/open-mercato
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      INNGEST_DEV: '1'
      INNGEST_BASE_URL: 'http://inngest:8288'
      INNGEST_EVENT_KEY: 'deadbeef00000000'
      INNGEST_SIGNING_KEY: 'e76da2be0b99bf81154903496abd262509c982cefa3763f934aab974f9938827'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inngest:
        condition: service_healthy
    networks:
      - devcontainer

  postgres:
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: open-mercato
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devcontainer

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devcontainer

  inngest-init:
    image: pgvector/pgvector:pg17-trixie
    restart: "no"
    environment:
      PGPASSWORD: 'postgres'
    command: >
      sh -c "psql -h postgres -U postgres -tc
      \"SELECT 1 FROM pg_database WHERE datname = 'inngest'\" | grep -q 1 ||
      psql -h postgres -U postgres -c 'CREATE DATABASE inngest'"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devcontainer

  inngest:
    image: inngest/inngest:latest
    restart: unless-stopped
    command: ["inngest", "start", "--host", "0.0.0.0", "--poll-interval", "5"]
    ports:
      - '8288:8288'
    environment:
      INNGEST_EVENT_KEY: 'deadbeef00000000'
      INNGEST_SIGNING_KEY: 'e76da2be0b99bf81154903496abd262509c982cefa3763f934aab974f9938827'
      INNGEST_POSTGRES_URI: 'postgres://postgres:postgres@postgres:5432/inngest'
      INNGEST_REDIS_URI: 'redis://redis:6379'
    depends_on:
      inngest-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - devcontainer
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8288/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  node_modules:
  app_next:
  attachments_storage:

networks:
  devcontainer:
    driver: bridge
